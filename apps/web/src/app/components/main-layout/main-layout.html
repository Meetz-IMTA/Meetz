<!-- Top nav bar -->
<header
  class="sticky top-0 z-50 flex justify-between items-center px-4 h-16 w-full bg-white border-b border-zinc-200 shadow-sm font-semibold">
  <div class="flex items-center gap-4">
    <span class="text-2xl font-black text-rose-700">Meetz</span>
    <nav class="hidden md:flex items-center gap-1 ml-8">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="top-nav-active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="top-nav-item text-sm px-3 py-1.5 rounded transition-all"
        >{{ item.label }}</a>
      }
    </nav>
  </div>
  <div class="flex items-center gap-3">
    <div class="relative hidden sm:block">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400"
            style="font-size: 20px;">search</span>
      <input
        class="pl-10 pr-4 py-1.5 rounded-lg border border-zinc-200 bg-zinc-50 focus:outline-none focus:ring-2 focus:ring-rose-700/20 w-64 text-sm"
        placeholder="Search Alès..."
        type="text"
      />
    </div>
    <button class="p-2 rounded-full hover:bg-rose-50 text-zinc-600 transition-colors" type="button">
      <span class="material-symbols-outlined">notifications</span>
    </button>
    <div
      class="h-8 w-8 rounded-full bg-rose-700 flex items-center justify-center text-white text-xs font-bold ring-2 ring-white overflow-hidden">
      {{ userInitial }}
    </div>
  </div>
</header>

<!-- Layout body -->
<div class="flex min-h-[calc(100vh-4rem)]">

  <!-- Page content -->
  <div class="flex-1 min-w-0 bg-zinc-50">
    <router-outlet/>
  </div>
</div>
