<div class="flex items-center gap-2 flex-wrap">
  @if (report.status !== 'resolved' && (report.threadId || report.commentId)) {
    <button
      type="button"
      (click)="onDelete()"
      class="flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold text-red-700 bg-red-50 hover:bg-red-100 border border-red-200 rounded-lg transition-colors"
    >
      <span class="material-symbols-outlined" style="font-size: 14px">delete</span>
      {{
        isThread
          ? 'Supprimer le post'
          : isMessage
            ? 'Supprimer le message'
            : 'Supprimer le commentaire'
      }}
    </button>
  }

  @if (report.status !== 'resolved') {
    <button
      type="button"
      (click)="onResolve()"
      class="flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-lg transition-colors"
    >
      <span class="material-symbols-outlined" style="font-size: 14px">check_circle</span>
      Résolu
    </button>
  }

  @if (report.status === 'pending' || report.status === 'reviewed') {
    <button
      type="button"
      (click)="onIgnore()"
      class="flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold text-zinc-500 bg-zinc-100 hover:bg-zinc-200 rounded-lg transition-colors"
    >
      <span class="material-symbols-outlined" style="font-size: 14px">do_not_disturb</span>
      Ignorer
    </button>
  }
</div>
