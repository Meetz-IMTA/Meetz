<div class="flex flex-col gap-2">
  <div class="flex items-center gap-2 flex-wrap">
    <a
      [routerLink]="['/profile', user.id]"
      class="flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold text-zinc-600 bg-zinc-100 hover:bg-zinc-200 rounded-lg transition-colors"
    >
      <span class="material-symbols-outlined" style="font-size: 14px">person</span>
      Voir profil
    </a>

    @if (user.isBanned) {
      <button
        type="button"
        (click)="submitUnban()"
        class="flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-lg transition-colors"
      >
        <span class="material-symbols-outlined" style="font-size: 14px">check_circle</span>
        Débannir
      </button>
    } @else {
      <button
        type="button"
        (click)="toggleBanForm()"
        class="flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold text-red-700 bg-red-50 hover:bg-red-100 border border-red-200 rounded-lg transition-colors"
      >
        <span class="material-symbols-outlined" style="font-size: 14px">block</span>
        Bannir
      </button>
    }
  </div>

  @if (showBanForm()) {
    <div class="flex items-center gap-2 mt-1">
      <input
        type="text"
        placeholder="Raison (optionnel)"
        [value]="banReason()"
        (input)="banReason.set($any($event.target).value)"
        class="flex-1 min-w-0 px-2.5 py-1 text-xs border border-zinc-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-300"
      />
      <button
        type="button"
        (click)="submitBan()"
        class="px-2.5 py-1 text-xs font-bold text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors shrink-0"
      >
        Confirmer
      </button>
      <button
        type="button"
        (click)="toggleBanForm()"
        class="px-2 py-1 text-xs font-semibold text-zinc-500 hover:text-zinc-700 transition-colors shrink-0"
      >
        Annuler
      </button>
    </div>
  }

  @if (user.isBanned && user.banReason) {
    <p class="text-xs text-red-600 italic">Raison : {{ user.banReason }}</p>
  }
</div>
