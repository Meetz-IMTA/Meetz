<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-lg">

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Meetz</h1>
      <p class="text-gray-500 mt-1">Connecte-toi à ton compte</p>
    </div>

    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">E-mail</label>
        <input pInputText [(ngModel)]="email" type="email" placeholder="john@doe.fr"
               class="w-full"/>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Mot de passe</label>
        @if (loginFailed) {
        <p-password [(ngModel)]="password" [feedback]="false" [toggleMask]="true"
                    styleClass="w-full" inputStyleClass="w-full"
                    [invalid]="true" />
        <small class="text-red-500 text-xs">Email ou mot de passe incorrect.</small>
        } @else {
        <p-password [(ngModel)]="password" [feedback]="false" [toggleMask]="true"
                    styleClass="w-full" inputStyleClass="w-full" />
        }
      </div>

      <p-button label="Se connecter" styleClass="w-full mt-2" (onClick)="onSubmit()" />

      <p class="text-center text-sm text-gray-500">
        Pas encore de compte ?
        <a routerLink="/register" class="text-primary-600 font-medium hover:underline">S'inscrire</a>
      </p>
    </div>

  </div>
</div>
