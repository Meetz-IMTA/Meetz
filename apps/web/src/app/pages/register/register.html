<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-lg">

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Meetz</h1>
      <p class="text-gray-500 mt-1">Crée ton compte</p>
    </div>

    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Nom</label>
        <input pInputText [(ngModel)]="name" type="text" placeholder="John Doe"
               class="w-full" [invalid]="registerFailed" />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">E-mail</label>
        <input pInputText [(ngModel)]="email" type="email" placeholder="john@doe.fr"
               class="w-full" [invalid]="registerFailed" />
        @if (registerFailed) {
          <small class="text-red-500 text-xs">{{ errorMessage }}</small>
        }
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Mot de passe</label>
        <p-password [(ngModel)]="password" [toggleMask]="true"
                    styleClass="w-full" inputStyleClass="w-full"
                    promptLabel="Entrez un mot de passe"
                    weakLabel="Faible" mediumLabel="Moyen" strongLabel="Fort"
                    [invalid]="passwordMismatch" />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Confirmer le mot de passe</label>
        @if (passwordMismatch) {
          <p-password [(ngModel)]="confirmPassword" [feedback]="false" [toggleMask]="true"
                      styleClass="w-full" inputStyleClass="w-full"
                      [invalid]="true" />
          <small class="text-red-500 text-xs">Les mots de passe ne correspondent pas.</small>
        } @else {
          <p-password [(ngModel)]="confirmPassword" [feedback]="false" [toggleMask]="true"
                      styleClass="w-full" inputStyleClass="w-full" />
        }
      </div>

      <p-button label="S'inscrire" styleClass="w-full mt-2" (onClick)="onSubmit()" />

      <p class="text-center text-sm text-gray-500">
        Déjà un compte ?
        <a routerLink="/login" class="text-primary-600 font-medium hover:underline">Se connecter</a>
      </p>
    </div>

  </div>
</div>
