<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-lg">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Meetz</h1>
      <p class="text-gray-500 mt-1">Vérifie ton adresse e-mail</p>
    </div>

    <div class="flex flex-col gap-6">
      <p class="text-sm text-gray-600 text-center">
        Un code à 6 chiffres a été envoyé à
        <span class="font-medium text-gray-800">{{ email }}</span
        >.<br />
        Il expire dans 10 minutes.
      </p>

      <div class="flex flex-col items-center gap-2">
        <p-inputotp [(ngModel)]="otp" [length]="6" [invalid]="verifyFailed" />
        @if (verifyFailed) {
          <small class="text-red-500 text-xs">{{ errorMessage }}</small>
        }
      </div>

      <p-button
        label="Vérifier"
        styleClass="w-full"
        [loading]="loading"
        [disabled]="otp.length !== 6"
        (onClick)="onSubmit()"
      />
    </div>
  </div>
</div>
