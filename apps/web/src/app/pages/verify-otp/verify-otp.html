<app-auth-shell
  description="Un code à 6 chiffres t'attend dans ta boîte mail. Saisis-le pour activer ton compte."
  iconTop="mark_email_unread"
  iconBottom="celebration"
>
  <ng-container headline>
    Presque <br />
    <span class="text-primary">là !</span>
  </ng-container>

  <div class="mb-10">
    <div class="w-14 h-14 bg-primary/10 rounded-2xl flex items-center justify-center mb-6">
      <span class="material-symbols-outlined text-3xl text-primary">mark_email_unread</span>
    </div>
    <h2 class="text-3xl font-headline font-extrabold text-gray-900 mb-2">Vérifie ton email</h2>
    <p class="text-on-surface-variant font-medium">
      Code envoyé à <span class="font-bold text-gray-800">{{ email }}</span
      >.<br />
      Il expire dans <span class="font-bold">10 minutes</span>.
    </p>
  </div>

  <div class="space-y-6">
    <div class="space-y-1">
      <label class="text-xs font-bold text-gray-500 ml-1 uppercase">Code de vérification</label>
      <div class="flex justify-center py-4">
        <p-inputotp [(ngModel)]="otp" [length]="6" [invalid]="verifyFailed" />
      </div>
      @if (verifyFailed) {
        <p class="text-red-500 text-xs ml-1 text-center">{{ errorMessage }}</p>
      }
    </div>

    <button
      type="button"
      (click)="onSubmit()"
      [disabled]="otp.length !== 6 || loading"
      class="w-full bg-primary text-white font-bold py-4 rounded-btn hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-lg shadow-primary/20 disabled:opacity-60 disabled:cursor-not-allowed"
    >
      @if (loading) {
        <span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span>
        Vérification...
      } @else {
        Vérifier le code
        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
      }
    </button>

    <p class="text-center text-sm text-gray-500">
      Tu n'as pas reçu de code ?
      <a routerLink="/login" class="text-primary font-bold hover:underline">Recommencer</a>
    </p>
  </div>
</app-auth-shell>
