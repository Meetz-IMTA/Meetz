# Configuration Nginx pour le conteneur Docker web (SPA Angular).
# Ce fichier sert les fichiers statiques sur le réseau interne de la VM.
# Il ne gère PAS le SSL — c'est le Nginx du LXC (reverse proxy) qui s'en charge.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip des assets statiques
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # Cache long terme pour les assets hachés (Angular output hashing)
    # Angular génère des noms de fichiers uniques à chaque build (ex: main.abc123.js)
    # → on peut les mettre en cache agressivement côté navigateur.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Toutes les routes non trouvées sont redirigées vers index.html.
    # Indispensable pour Angular Router : un refresh sur /events/42
    # doit servir index.html, pas retourner un 404 Nginx.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Désactivation du logging pour les healthchecks Docker (évite le bruit)
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
